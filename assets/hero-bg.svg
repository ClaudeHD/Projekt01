<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Abstrakter Mining- und Energiehintergrund">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1226"/>
      <stop offset="0.55" stop-color="#13203f"/>
      <stop offset="1" stop-color="#1a2847"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.7" cy="0.25" r="0.8">
      <stop offset="0" stop-color="#00ff41" stop-opacity="0.22"/>
      <stop offset="0.4" stop-color="#00ff41" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#00ff41" stop-opacity="0"/>
    </radialGradient>
    <pattern id="hex" width="56" height="64" patternUnits="userSpaceOnUse" patternTransform="scale(1.4)">
      <path d="M28 0 56 16 56 48 28 64 0 48 0 16Z" fill="none" stroke="#2a3c66" stroke-width="1" opacity="0.5"/>
    </pattern>
    <pattern id="circuit" width="200" height="200" patternUnits="userSpaceOnUse">
      <path d="M0 40 H120 V120 H200 M40 200 V100 H160 V0" fill="none" stroke="#00ff41" stroke-width="1.2" opacity="0.12"/>
      <circle cx="120" cy="120" r="3" fill="#00ff41" opacity="0.35"/>
      <circle cx="40" cy="40" r="3" fill="#00ff41" opacity="0.25"/>
      <circle cx="160" cy="100" r="3" fill="#00ff41" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect width="1440" height="900" fill="url(#hex)"/>
  <rect width="1440" height="900" fill="url(#circuit)"/>
  <rect width="1440" height="900" fill="url(#glow)"/>
  <!-- Stylized server racks -->
  <g opacity="0.5">
    <rect x="980" y="520" width="360" height="300" rx="10" fill="#0e1830" stroke="#2a3c66" stroke-width="2"/>
    <g fill="#00ff41" opacity="0.6">
      <rect x="1000" y="545" width="320" height="24" rx="4" opacity="0.18"/>
      <rect x="1000" y="585" width="320" height="24" rx="4" opacity="0.18"/>
      <rect x="1000" y="625" width="320" height="24" rx="4" opacity="0.18"/>
      <rect x="1000" y="665" width="320" height="24" rx="4" opacity="0.18"/>
      <rect x="1000" y="705" width="320" height="24" rx="4" opacity="0.18"/>
      <rect x="1000" y="745" width="320" height="24" rx="4" opacity="0.18"/>
      <circle cx="1305" cy="557" r="4"/><circle cx="1305" cy="597" r="4"/>
      <circle cx="1305" cy="637" r="4"/><circle cx="1305" cy="677" r="4"/>
    </g>
  </g>
</svg>
