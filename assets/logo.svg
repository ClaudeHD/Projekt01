    <linearGradient id="hvHex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2847"/>
      <stop offset="1" stop-color="#0e1830"/>
    </linearGradient>
    <linearGradient id="hvBolt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ff41"/>
