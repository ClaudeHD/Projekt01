<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Animiertes Wasserkraftwerk – fließendes Wasser und Turbinen">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#0b1226"/>
      <stop offset="0.55" stop-color="#0e1830"/>
      <stop offset="1"   stop-color="#10233f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38e1ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1aa9d6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="dam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2847"/>
      <stop offset="1" stop-color="#0b1226"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"  stop-color="#00ff41" stop-opacity="0.9"/>
      <stop offset="1"  stop-color="#00ff41" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bdf3ff" stop-opacity="0.0"/>
      <stop offset="0.2" stop-color="#bdf3ff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#38e1ff" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- sky / backdrop -->
  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- soft light shafts -->
  <g opacity="0.18">
    <polygon points="200,0 360,0 240,900 40,900" fill="#38e1ff">
      <animate attributeName="opacity" values="0.10;0.22;0.10" dur="9s" repeatCount="indefinite"/>
    </polygon>
    <polygon points="1100,0 1280,0 1420,900 1180,900" fill="#00ff41">
      <animate attributeName="opacity" values="0.18;0.06;0.18" dur="11s" repeatCount="indefinite"/>
    </polygon>
  </g>

  <!-- upper reservoir water with shimmer -->
  <rect x="0" y="120" width="1600" height="180" fill="url(#water)"/>
  <g stroke="#bdf3ff" stroke-width="2" opacity="0.35">
    <path d="M0,180 q200,-18 400,0 t400,0 t400,0 t400,0" fill="none">
      <animate attributeName="d"
        values="M0,180 q200,-18 400,0 t400,0 t400,0 t400,0;
                M0,180 q200,18 400,0 t400,0 t400,0 t400,0;
                M0,180 q200,-18 400,0 t400,0 t400,0 t400,0"
        dur="7s" repeatCount="indefinite"/>
    </path>
    <path d="M0,230 q200,16 400,0 t400,0 t400,0 t400,0" fill="none" opacity="0.5">
      <animate attributeName="d"
        values="M0,230 q200,16 400,0 t400,0 t400,0 t400,0;
                M0,230 q200,-16 400,0 t400,0 t400,0 t400,0;
                M0,230 q200,16 400,0 t400,0 t400,0 t400,0"
        dur="8.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- dam body -->
  <path d="M0,300 L1600,300 L1600,640 Q1300,610 1000,640 Q700,670 400,640 Q200,620 0,650 Z" fill="url(#dam)"/>
  <rect x="0" y="300" width="1600" height="14" fill="#38e1ff" opacity="0.25"/>

  <!-- spillway gates -->
  <g>
    <!-- five falling water streams -->
    <g>
      <rect x="240" y="314" width="120" height="320" fill="url(#fall)">
        <animate attributeName="opacity" values="0.7;1;0.7" dur="2.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="560" y="314" width="120" height="320" fill="url(#fall)">
        <animate attributeName="opacity" values="1;0.65;1" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="880" y="314" width="120" height="320" fill="url(#fall)">
        <animate attributeName="opacity" values="0.75;1;0.75" dur="2.0s" repeatCount="indefinite"/>
      </rect>
      <rect x="1200" y="314" width="120" height="320" fill="url(#fall)">
        <animate attributeName="opacity" values="1;0.7;1" dur="2.4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <!-- streaks rushing down -->
    <g stroke="#eaffff" stroke-width="3" stroke-linecap="round" opacity="0.7">
      <line x1="300" y1="314" x2="300" y2="380">
        <animate attributeName="y1" values="314;560" dur="0.9s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="380;626" dur="0.9s" repeatCount="indefinite"/>
      </line>
      <line x1="620" y1="314" x2="620" y2="380">
        <animate attributeName="y1" values="314;560" dur="1.1s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="380;626" dur="1.1s" repeatCount="indefinite"/>
      </line>
      <line x1="940" y1="314" x2="940" y2="380">
        <animate attributeName="y1" values="314;560" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="380;626" dur="0.8s" repeatCount="indefinite"/>
      </line>
      <line x1="1260" y1="314" x2="1260" y2="380">
        <animate attributeName="y1" values="314;560" dur="1.0s" repeatCount="indefinite"/>
        <animate attributeName="y2" values="380;626" dur="1.0s" repeatCount="indefinite"/>
      </line>
    </g>
  </g>

  <!-- turbine glow points (energy) -->
  <g>
    <circle cx="300" cy="470" r="70" fill="url(#glow)">
      <animate attributeName="r" values="55;80;55" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="940" cy="470" r="70" fill="url(#glow)">
      <animate attributeName="r" values="80;55;80" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1260" cy="470" r="60" fill="url(#glow)">
      <animate attributeName="r" values="50;72;50" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- foaming tail water -->
  <rect x="0" y="630" width="1600" height="270" fill="#0a1a2e"/>
  <g stroke="#38e1ff" stroke-width="2" opacity="0.4" fill="none">
    <path d="M0,690 q150,-22 300,0 t300,0 t300,0 t300,0 t300,0">
      <animate attributeName="d"
        values="M0,690 q150,-22 300,0 t300,0 t300,0 t300,0 t300,0;
                M0,690 q150,22 300,0 t300,0 t300,0 t300,0 t300,0;
                M0,690 q150,-22 300,0 t300,0 t300,0 t300,0 t300,0"
        dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M0,750 q150,20 300,0 t300,0 t300,0 t300,0 t300,0" opacity="0.6">
      <animate attributeName="d"
        values="M0,750 q150,20 300,0 t300,0 t300,0 t300,0 t300,0;
                M0,750 q150,-20 300,0 t300,0 t300,0 t300,0 t300,0;
                M0,750 q150,20 300,0 t300,0 t300,0 t300,0 t300,0"
        dur="6.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- rising bubbles -->
  <g fill="#bdf3ff">
    <circle cx="420" cy="860" r="4" opacity="0.7">
      <animate attributeName="cy" values="860;650" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.8;0" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="780" cy="880" r="5" opacity="0.6">
      <animate attributeName="cy" values="880;640" dur="7.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="7.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="870" r="3" opacity="0.7">
      <animate attributeName="cy" values="870;660" dur="5.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.9;0" dur="5.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="980" cy="890" r="4" opacity="0.6">
      <animate attributeName="cy" values="890;655" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;0.7;0" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
